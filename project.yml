name: LibrusWatch
options:
  bundleIdPrefix: com.alowyy
  xcodeVersion: "16.0"
  deploymentTarget:
    iOS: "16.0"
    watchOS: "10.0"

settings:
  base:
    SWIFT_VERSION: "5.9"
    CODE_SIGNING_ALLOWED: "NO"
    CODE_SIGN_IDENTITY: ""
    DEVELOPMENT_TEAM: ""

targets:
  LibrusApp:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: iOS/LibrusApp
      - path: iOS/Shared
    info:
      path: iOS/LibrusApp/Info.plist
    dependencies:
      - target: LibrusWatch
        embed: true
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.alowyy.libruswatch
      INFOPLIST_FILE: iOS/LibrusApp/Info.plist
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  LibrusWatch:
    type: application
    platform: watchOS
    deploymentTarget: "10.0"
    sources:
      - path: iOS/LibrusWatch/Views
      - path: iOS/LibrusWatch/Services
      - path: iOS/LibrusWatch/LibrusWatchApp.swift
      - path: iOS/LibrusWatch/Assets.xcassets
      - path: iOS/Shared
    info:
      path: iOS/LibrusWatch/Info.plist
      properties:
        WKApplication: true
        WKCompanionAppBundleIdentifier: com.alowyy.libruswatch
    dependencies:
      - target: LibrusComplicationExtension
        embed: true
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.alowyy.libruswatch.watchkitapp
      INFOPLIST_FILE: iOS/LibrusWatch/Info.plist
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      GENERATE_INFOPLIST_FILE: NO

  LibrusComplicationExtension:
    type: app-extension
    platform: watchOS
    deploymentTarget: "10.0"
    sources:
      - path: iOS/LibrusWatch/Complications
      - path: iOS/LibrusWatch/Services/OfflineStorage.swift
      - path: iOS/Shared
    info:
      path: iOS/LibrusWatch/Complications/Info.plist
      properties:
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.alowyy.libruswatch.watchkitapp.complication
      INFOPLIST_FILE: iOS/LibrusWatch/Complications/Info.plist
      GENERATE_INFOPLIST_FILE: NO
