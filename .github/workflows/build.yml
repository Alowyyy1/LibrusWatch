name: Build LibrusWatch IPA

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build iOS & watchOS IPA
    runs-on: macos-14

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Select Xcode Version
        run: |
          XCODE_APP=$(find /Applications -maxdepth 1 -name "Xcode_16*.app" | sort -V | tail -n 1)
          if [ -n "$XCODE_APP" ]; then
            echo "Selecting $XCODE_APP"
            sudo xcode-select -s "$XCODE_APP"
          fi
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Build Archive (iOS + Watch)
        run: |
          xcodebuild archive \
            -project LibrusWatch.xcodeproj \
            -scheme LibrusApp \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath build/LibrusApp.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES

      - name: Package into IPA (SideStore / AltStore / TrollStore compatible)
        run: |
          mkdir -p build/Payload
          cp -r build/LibrusApp.xcarchive/Products/Applications/LibrusApp.app build/Payload/
          APP_PLIST="build/Payload/LibrusApp.app/Info.plist"
          if [ -f "$APP_PLIST" ]; then
            plutil -replace CFBundleDisplayName -string "Librus Sync" "$APP_PLIST" || true
            plutil -replace UILaunchStoryboardName -string "LaunchScreen" "$APP_PLIST" || true
          fi
          WATCH_PLIST="build/Payload/LibrusApp.app/Watch/LibrusWatch.app/Info.plist"
          if [ -f "$WATCH_PLIST" ]; then
            plutil -replace CFBundleDisplayName -string "Librus Sync" "$WATCH_PLIST" || true
            plutil -replace WKApplication -bool YES "$WATCH_PLIST" || true
            plutil -replace WKCompanionAppBundleIdentifier -string com.alowyy1.librussync "$WATCH_PLIST" || true
          fi
          cd build
          zip -r LibrusWatch.ipa Payload
          cd ..

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LibrusWatch-IPA
          path: build/LibrusWatch.ipa
          retention-days: 14
