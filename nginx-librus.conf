# Nginx Reverse Proxy Configuration for LibrusWatch Backend
# Place in /etc/nginx/sites-available/librus and symlink to /etc/nginx/sites-enabled/
# Then run: sudo certbot --nginx -d librus.alowy.xyz

server {
    server_name librus.alowy.xyz; # Замените на ваш поддомен

    location / {
        proxy_pass http://127.0.0.1:8095;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    listen 80;
}
